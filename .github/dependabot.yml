version: 2

# grouped: every push to main rebases each open PR, and each rebase is a full Tauri compile
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 1
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns:
          - "*"

  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    commit-message:
      prefix: deps
    groups:
      # majors apart: one breaking bump must not hold back the safe ones
      cargo-majors:
        patterns:
          - "*"
        update-types:
          - major
      cargo:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    commit-message:
      prefix: deps
    groups:
      npm-majors:
        patterns:
          - "*"
        update-types:
          - major
      npm:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
