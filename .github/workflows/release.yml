name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  create-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Extract changelog for release notes
        run: |
          awk '/^## \[/{if(found) exit; found=1; next} found' CHANGELOG.md > release-notes.md

      # suffixed tags (v1.3.0-beta.1) go out as prereleases, which the update check never offers
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF_NAME}"
          case "$tag" in *-*) pre=true ;; *) pre=false ;; esac
          gh release create "$tag" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Ctrl+R $tag" \
            --notes-file release-notes.md \
            --draft \
            --prerelease="$pre"

  build:
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: windows
          - os: macos-latest
            target: macos
          - os: ubuntu-22.04
            target: linux

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7

      # uncached, npm too: caches are scoped to their ref and no tag reads another tag's
      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable

      - name: Install Linux dependencies
        if: matrix.target == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      # not npm ci: optional native deps differ per platform and libc, and npm ci rejects the gaps
      - run: npm install --no-audit --no-fund

      # macos-latest is arm64; an untargeted build's DMG cannot run on an Intel Mac
      - name: Add macOS targets
        if: matrix.target == 'macos'
        run: rustup target add x86_64-apple-darwin aarch64-apple-darwin

      - name: Build
        shell: bash
        run: |
          if [ "${{ matrix.target }}" = "macos" ]; then
            npx tauri build --target universal-apple-darwin
          else
            npx tauri build
          fi

      - name: Rename and upload assets to release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME}"
          mkdir -p release-files
          find target/release/bundle/nsis -name "*.exe" -exec cp {} "release-files/Ctrl+R-${tag}-Windows-x64.exe" \; 2>/dev/null || true
          find target/universal-apple-darwin/release/bundle/dmg -name "*.dmg" -exec cp {} "release-files/Ctrl+R-${tag}-macOS.dmg" \; 2>/dev/null || true
          find target/release/bundle/deb -name "*.deb" -exec cp {} "release-files/Ctrl+R-${tag}-Linux-x64.deb" \; 2>/dev/null || true
          find target/release/bundle/appimage -name "*.AppImage" -exec cp {} "release-files/Ctrl+R-${tag}-Linux-x64.AppImage" \; 2>/dev/null || true
          # every copy above tolerates a miss; a platform whose bundle never built must fail
          if [ -z "$(ls -A release-files 2>/dev/null)" ]; then
            echo "no bundle produced for ${{ matrix.target }}" >&2
            exit 1
          fi
          for f in release-files/*; do
            gh release upload "$tag" "$f" --repo "$GITHUB_REPOSITORY"
          done

  finalize:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release edit "${GITHUB_REF_NAME}" --repo "$GITHUB_REPOSITORY" --draft=false
