[workspace]
resolver = "2"
members = [
    "crates/ctrlr-core",
    "crates/ctrlr-desktop",
]

[workspace.package]
version = "1.2.0"
edition = "2024"
license = "LicenseRef-Proprietary"

[workspace.dependencies]
ctrlr-core = { path = "crates/ctrlr-core" }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
base64 = "0.23"
toml = "1.1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
urlencoding = "2"
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-build = { version = "2", features = [] }
tauri-plugin-deep-link = "2"
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
russh = { version = "0.65", default-features = false, features = ["ring", "flate2"] }
keyring = { version = "3.6", features = ["windows-native", "apple-native", "sync-secret-service", "crypto-rust"] }
serde_bencode = "0.2"
sha1_smol = "1"
quick-xml = "0.42"
tauri-plugin-notification = "2"
tauri-plugin-dialog = "2"
tauri-plugin-window-state = "2"
tauri-plugin-autostart = "2"
tauri-plugin-opener = "2"
feed-rs = "3"
regex = "1"
semver = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
rusqlite = { version = "0.41", features = ["bundled"] }
